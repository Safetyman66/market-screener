name: Daily Market Screener

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Master Screener
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python scanner.py

      - name: Commit and push updated cache and CSV watchlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_cache.json zacks_rank_tracker.json watchlist_*.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update scanner cache & watchlists [skip ci]"
            git push
          fi

      - name: Deploy to Website Repository
        env:
          PAT_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the public website repository into a temporary folder
          git clone https://x-access-token:${PAT_TOKEN}@github.com/Safetyman66/corpacuity-website.git site_temp

          # Copy over the website files and PDF
          cp index.html site_temp/
          cp CNAME site_temp/
          cp daily_market_intelligence.pdf site_temp/

          # Push changes to the public site repo
          cd site_temp
          git add index.html CNAME daily_market_intelligence.pdf
          git commit -m "Auto-deploy daily market intelligence [skip ci]" || echo "No changes to commit"
          git push origin main