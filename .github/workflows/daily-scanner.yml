name: Daily Market Screener & Site Deploy

on:
  schedule:
    # 00:30 UTC Tuesday through Saturday
    - cron: '30 0 * * 2-6'
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests lxml html5lib reportlab

      - name: Run Master Screener (Calculations & PDF Generation)
        run: |
          python scanner.py

      - name: Commit and push updated artifacts and metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_cache.json zacks_rank_tracker.json watchlist_*.csv daily_market_intelligence.pdf latest_post_meta.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update scanner cache, PDF & post metadata [skip ci]"
            git push
          fi

      - name: Deploy to Website Repository
        env:
          PAT_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${PAT_TOKEN}@github.com/Safetyman66/corpacuity-website.git site_temp
          cp index.html site_temp/ || true
          cp CNAME site_temp/ || true
          cp daily_market_intelligence.pdf site_temp/
          cd site_temp
          git add -A
          git commit -m "Auto-deploy daily market intelligence [skip ci]" || echo "No changes to commit"
          git push origin main