name: Daily Market Screener & Site Deploy

on:
  schedule:
    - cron: '30 0 * * 2-6'
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Screener
        run: |
          python scanner.py

      - name: Commit and push updated artifacts and metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_cache.json zacks_rank_tracker.json trade_history.json terminal_feed.json master_screener_results.csv daily_market_intelligence.pdf latest_post_meta.json x_cards/ thumbnails/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update scanner cache, trade history, web feed, PDF, metadata, X cards & Thumbnails [skip ci]"
            git push
          fi

      - name: Deploy to Website Repository
        env:
          PAT_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${PAT_TOKEN}@github.com/Safetyman66/corpacuity-website.git site_temp
          
          # Deploying the restored HTML files
          cp index.html site_temp/ || true
          cp intel.html site_temp/ || true
          cp CNAME site_temp/ || true
          cp nav.js site_temp/ || true
          cp logo.png site_temp/ || true
          
          # Deploying the data payloads for the website
          cp daily_market_intelligence.pdf site_temp/
          cp terminal_feed.json site_temp/ || true
          cp latest_post_meta.json site_temp/ || true
          
          mkdir -p site_temp/x_cards
          cp -r x_cards/* site_temp/x_cards/ || true
          
          mkdir -p site_temp/thumbnails
          cp -r thumbnails/* site_temp/thumbnails/ || true

          cd site_temp
          git add -A
          git commit -m "Auto-deploy daily intelligence, terminal feed, X cards & Thumbnails [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python publish_linkedin.py

      - name: Dispatch X Intent Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_RECIPIENT: "ajmcneilster@gmail.com"
        run: |
          python dispatch_x_intent.py