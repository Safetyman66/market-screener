name: Morning Social Broadcast

on:
  schedule:
    # 07:00 UTC Tuesday through Saturday (08:00 BST / 07:00 GMT)
    - cron: '0 7 * * 2-6'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab yfinance pandas numpy pymupdf

      # Step 1: LinkedIn Document Carousel Post & Engagement First Comment
      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python publish_linkedin.py

      # Step 2: X Morning Intent Dispatch Email
      - name: Dispatch X Intent Link
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_RECIPIENT: "am@corpacuity.co.uk"
        run: |
          python dispatch_x_intent.py