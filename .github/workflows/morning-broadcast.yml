name: Morning Social Broadcast

on:
  schedule:
    # 07:00 UTC = 07:00 GMT / 08:00 BST Tuesday through Saturday
    - cron: '0 7 * * 2-6'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab yfinance pandas numpy pymupdf tweepy

      # Step 1: LinkedIn Broadcast (Native PDF Carousel + First Comment)
      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python publish_linkedin.py

      # Step 2: X Broadcast (4 PNG Cards + Threaded Link to corpacuity.co.uk)
      - name: Publish to X (Twitter)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python publish_x.py